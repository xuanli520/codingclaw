name: CI regression
description: Report a failing, skipped, or flaky GitHub Actions path that blocks verification or weakens merge protection.
title: "[ci] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for workflow failures, skipped critical checks, matrix regressions, missing toolchain setup, or merge-gate drift.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and workflow runs first.
          required: true
        - label: I included the exact failing workflow, job, or skipped test signal below.
          required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - verify
        - enforce-repo-gate
        - another workflow
        - local reproduction only
    validations:
      required: true
  - type: input
    id: run-url
    attributes:
      label: Workflow run URL
      description: Paste the GitHub Actions run link if available.
      placeholder: https://github.com/xuanli520/codingclaw/actions/runs/...
    validations:
      required: false
  - type: input
    id: branch-pr
    attributes:
      label: Branch or pull request
      placeholder: main, feature/phase1, PR #12
    validations:
      required: true
  - type: dropdown
    id: trigger
    attributes:
      label: Trigger
      options:
        - pull_request
        - push
        - workflow_dispatch
        - schedule
        - local reproduction only
        - unknown
    validations:
      required: true
  - type: textarea
    id: failing-step
    attributes:
      label: Failing or skipped step
      description: Name the exact job and step, or quote the skipped test line.
      placeholder: verify / python scripts/verify.py, SKIPPED ... bun is required
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Merge impact
      options:
        - blocks all PRs
        - skips critical coverage
        - flaky but mergeable
        - unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the exact command path or workflow scenario that reproduces the problem.
      placeholder: |
        1. Push branch ...
        2. Open PR ...
        3. Observe verify workflow ...
        4. Local reproduction command ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected CI behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual CI behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runner and toolchain details
      description: Include runner image, Python version, Bun version, uv version, and any matrix values you know.
      render: shell
      placeholder: |
        Runner:
        Python:
        Bun:
        uv:
        Matrix:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant workflow logs
      render: shell
    validations:
      required: true
  - type: upload
    id: attachments
    attributes:
      label: Attachments
      description: Upload workflow screenshots, downloaded logs, or artifacts when text alone is not enough.
    validations:
      required: false
