[project]
name = "codingclaw-harness"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "contract: contract-by-example suites",
    "integration: integration suites",
    "smoke: merge-gate smoke suites",
]
